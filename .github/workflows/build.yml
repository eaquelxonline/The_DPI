# Freedom Network — CI: tests, Android APK and Windows EXE (app-image) on every push to Freedom_Network_Beta.
# Only first-party GitHub actions are used. Signing material comes from repository secrets
# (optional); without them the debug APK is still installable for testing.
name: Build

on:
  push:
    branches: [Freedom_Network_Beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain (pinned by Native/rust-toolchain.toml)
        run: |
          rustup toolchain install 1.99.1 --profile minimal -c clippy,rustfmt -t aarch64-linux-android -t x86_64-pc-windows-msvc -t x86_64-pc-windows-gnu
          rustc +1.99.1 --version

      - name: Android SDK platform 37.0 and NDK 30
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.0" "ndk;30.0.16248370"

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.FREEDOM_KEYSTORE_BASE64 || secrets.THEDPI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FREEDOM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          FREEDOM_KEYSTORE_PASSWORD: ${{ secrets.FREEDOM_KEYSTORE_PASSWORD || secrets.THEDPI_KEYSTORE_PASSWORD }}
          FREEDOM_KEY_ALIAS: ${{ secrets.FREEDOM_KEY_ALIAS || secrets.THEDPI_KEY_ALIAS }}
          FREEDOM_KEY_PASSWORD: ${{ secrets.FREEDOM_KEY_PASSWORD || secrets.THEDPI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon check :Android:assembleDebug :Android:assembleRelease

      - name: Verify APK native 16 KB alignment and JNI exports
        run: |
          set -euo pipefail
          REL_APK=$(find Android/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find Android/build/outputs/apk/debug -name "*.apk" | head -n 1)
          for APK in "$DBG_APK" "$REL_APK"; do
            echo "Inspecting $APK..."
            unzip -l "$APK" | grep -q "lib/arm64-v8a/libfreedom.so"
            unzip -p "$APK" lib/arm64-v8a/libfreedom.so > "$RUNNER_TEMP/libfreedom.so"
            if command -v readelf >/dev/null 2>&1; then
              readelf -lW "$RUNNER_TEMP/libfreedom.so" | grep -E "LOAD.*0x4000"
              readelf -Ws "$RUNNER_TEMP/libfreedom.so" | grep -q "Java_com_freedom_network_Native_apiVersion"
            fi
          done
          echo "Native libfreedom.so 16KB ELF alignment & JNI symbols verified."

      - uses: actions/upload-artifact@v7
        with:
          name: FreedomNetwork-Android
          path: Android/build/outputs/apk/**/*.apk
          retention-days: 30

  windows:
    name: Windows EXE (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain (pinned by Native/rust-toolchain.toml)
        run: |
          rustup toolchain install 1.99.1 --profile minimal -c clippy,rustfmt -t aarch64-linux-android -t x86_64-pc-windows-msvc -t x86_64-pc-windows-gnu
          rustc +1.99.1 --version

      - name: Test on real Windows and package
        run: ./gradlew --no-daemon "-Pfreedom.windowsOnly=true" :check :Windows:check :Windows:packageWindows

      - name: Smoke-test FreedomNetwork.exe --cli --help & --self-test on real Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path "Windows/build/package/image/FreedomNetwork/FreedomNetwork.exe").Path
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          foreach ($modeArg in @("--help", "--self-test")) {
            $outFile = Join-Path $env:RUNNER_TEMP "freedom-cli-out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "freedom-cli-err.txt"
            $proc = Start-Process -FilePath $exe -ArgumentList @("--cli", $modeArg) -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $out = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { "" }
            $err = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { "" }
            if ($out) { Write-Host $out }
            if ($err) { Write-Host $err }
            if ($proc.ExitCode -ne 0) { throw "FreedomNetwork.exe --cli $modeArg failed with $($proc.ExitCode)" }
            if ($modeArg -eq "--help" -and $out -notmatch "Freedom Network CLI") {
              throw "FreedomNetwork.exe --cli --help did not print expected banner"
            }
            if ($modeArg -eq "--self-test" -and $out -notmatch "SELF-TEST PASSED") {
              throw "FreedomNetwork.exe --cli --self-test did not report SELF-TEST PASSED"
            }
          }

      - name: Zip app image
        shell: pwsh
        run: |
          Compress-Archive -Path Windows/build/package/image/FreedomNetwork -DestinationPath FreedomNetwork-Windows-x64.zip -CompressionLevel Optimal
          $bytes = (Get-Item FreedomNetwork-Windows-x64.zip).Length
          Write-Host ("FreedomNetwork-Windows-x64.zip size: {0:N2} MB ({1} bytes)" -f ($bytes / 1MB), $bytes)

      - uses: actions/upload-artifact@v7
        with:
          name: FreedomNetwork-Windows-x64
          path: FreedomNetwork-Windows-x64.zip
          retention-days: 30

  android-emulator-test:
    name: Android Emulator (KVM x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Rust toolchain (x86_64-linux-android + toolchain targets)
        run: |
          rustup toolchain install 1.99.1 --profile minimal -c clippy,rustfmt -t aarch64-linux-android -t x86_64-linux-android -t x86_64-pc-windows-msvc -t x86_64-pc-windows-gnu

      - name: Android SDK platform 37.0 and NDK 30
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.0" "ndk;30.0.16248370"

      - name: Build x86_64 Debug APK
        run: ./gradlew --no-daemon -Pfreedom.includeX86_64=true :Android:assembleDebug

      - name: Boot Android Emulator (KVM) and verify MainActivity
        run: |
          set -euo pipefail
          unset XDG_CONFIG_HOME
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME/avd"
          if [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then
            sudo -n chmod 666 /dev/kvm 2>/dev/null || true
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd -n freedom_avd -k "system-images;android-35;google_apis;x86_64" --path "$HOME/.android/avd/freedom_avd.avd" --force
          emulator -avd freedom_avd -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect &
          EMU_PID=$!
          trap 'kill $EMU_PID 2>/dev/null || true' EXIT
          adb wait-for-device
          BOOT=""
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$BOOT" != "1" ]; then
            echo "Emulator failed to finish booting in time"
            exit 1
          fi
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          adb shell input keyevent 82 >/dev/null 2>&1 || true
          adb shell settings put global close_quic_connection -1 >/dev/null 2>&1 || true
          adb install -r -d Android/build/outputs/apk/debug/Android-debug.apk
          adb logcat -c
          adb shell am start -W -n com.freedom.network/.MainActivity
          sleep 5
          CRASHES=$(adb logcat -d -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|com.freedom.network" || true)
          if [ -n "$CRASHES" ]; then
            echo "CRASH DETECTED:"
            echo "$CRASHES"
            exit 1
          fi
          PID=$(adb shell pidof com.freedom.network 2>/dev/null | tr -d '\r' || true)
          if [ -z "$PID" ]; then
            echo "com.freedom.network process did not stay alive!"
            adb logcat -d | tail -n 80
            exit 1
          fi
          adb shell dumpsys package com.freedom.network | grep -E "FreedomVpnService|MainActivity"
          echo "Android Emulator smoke test PASSED (PID=$PID)"

  publish:
    name: Publish Release & Sync Drive
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Prepare clean release binaries
        shell: bash
        run: |
          mkdir -p release-files
          WIN_ZIP=$(find dist/FreedomNetwork-Windows-x64 -name "*.zip" | head -n 1 || true)
          if [ -n "$WIN_ZIP" ] && [ -f "$WIN_ZIP" ]; then
            cp "$WIN_ZIP" release-files/FreedomNetwork-Windows-x64.zip
          fi
          DBG_APK=$(find dist/FreedomNetwork-Android -name "*debug*.apk" | head -n 1 || true)
          if [ -n "$DBG_APK" ] && [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" release-files/FreedomNetwork-Android-debug.apk
          fi
          REL_APK=$(find dist/FreedomNetwork-Android -name "*release*.apk" | head -n 1 || true)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" release-files/FreedomNetwork-Android-release.apk
          fi
          ls -lh release-files/
          if [ -z "$(ls -A release-files)" ]; then
            echo "No release files found!" >&2
            exit 1
          fi

      - name: Publish rolling prerelease (latest-beta)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="Otomatik CI derlemesi (${GITHUB_REF_NAME} @ ${SHORT_SHA}) — Windows x64 + Android arm64-v8a"
          if gh release view latest-beta -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest-beta -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Freedom Network Latest Beta (${SHORT_SHA})" \
              --notes "$NOTES"
            gh release upload latest-beta -R "$GITHUB_REPOSITORY" release-files/* --clobber
          else
            gh release create latest-beta release-files/* -R "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Freedom Network Latest Beta (${SHORT_SHA})" \
              --notes "$NOTES"
          fi

      - name: Sync built APK & Windows EXE to Google Drive
        env:
          HOOK_URL: ${{ secrets.DRIVE_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::DRIVE_HOOK_URL secret'i tanimli degil, Drive ikili dosya yuklemesi atlandi."
            exit 0
          fi
          SEP='?'
          case "$HOOK_URL" in
            *\?*) SEP='&' ;;
          esac
          TARGET_URL="${HOOK_URL}${SEP}mode=binaries&repo=${GITHUB_REPOSITORY}&branch=${GITHUB_REF_NAME}&sha=${GITHUB_SHA}&run_id=${GITHUB_RUN_ID}"
          YANIT=""
          for attempt in 1 2 3; do
            echo "Drive Son_Surum senkronizasyonu (deneme $attempt)..."
            YANIT=$(curl -sSL --max-time 300 "$TARGET_URL" || true)
            echo "Yanit: $YANIT"
            case "$YANIT" in
              OK*|ZATEN_GUNCEL*)
                echo "Drive ikili dosya yuklemesi basarili: $YANIT"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::Drive ikili dosya yuklemesi basarisiz: $YANIT"
          exit 1
